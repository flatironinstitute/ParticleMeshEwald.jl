name = "ParticleMeshEwald"
uuid = "cd47a632-4c33-49da-880f-bcc568aa1a40"
version = "0.1.0"
authors = ["Xuanzhao Gao <xgao@flatironinstitute.org>"]

[deps]
CellListMap = "69e1c6dd-3888-40e6-b3c8-31ac5f578864"
FINUFFT = "d8beea63-0952-562e-9c6a-8e8ef7364055"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
LoopVectorization = "bdcacae8-1622-11e9-2a5c-532679323890"
SIMD = "fdea26ae-647d-5447-a871-4b548cad5224"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"

[weakdeps]
ExTinyMD = "fec76197-d59f-46dd-a0ed-76a83c21f7aa"

[extensions]
ParticleMeshEwaldExTinyMDExt = "ExTinyMD"

# ExTinyMD 0.3 is not yet published (General has only 0.2.7), so the test
# target needs an override to resolve at all.
#
# This points at the git URL rather than a sibling path deliberately: a
# {path = "../ExTinyMD.jl"} pin resolves locally but cannot work in CI, where
# only this repository is checked out and actions/checkout will not write
# outside the workspace. Verified: with a path pin, `Pkg.test()` fails with
# `expected package ExTinyMD [fec76197] to exist at path .../ExTinyMD.jl`.
#
[compat]
CellListMap = "0.10"
ExTinyMD = "0.3"
FINUFFT = "3.4.2"
LinearAlgebra = "1"
LoopVectorization = "0.12.173"
SIMD = "3.7.2"
SpecialFunctions = "2.6.1"
julia = "1.10"

[extras]
ExTinyMD = "fec76197-d59f-46dd-a0ed-76a83c21f7aa"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "ExTinyMD", "Random", "StaticArrays"]
